name: ci
on:
  pull_request:
    branches:
      - master
  push:
    branches:
      - master

permissions:
  contents: read

# A new push to a pull request cancels the run of the previous one. Every run
# on master gets a group of its own, so none is cancelled, not even while it
# waits behind another.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

# Actions use readable version tags; actions.lock pins the code that runs,
# including transitive action dependencies.
jobs:
  go-versions:
    name: Go versions
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      versions: ${{ steps.versions.outputs.versions }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7.0.0
        with:
          go-version: stable
          cache: false
      # Every Go minor release from the one go.mod requires up to the current
      # stable release, e.g. ["1.25","1.26","1.27"].
      - name: List Go versions from go.mod to stable
        id: versions
        env:
          GOTOOLCHAIN: local
        run: |
          awk -v stable="$(go env GOVERSION)" '
            $1 == "go" { split($2, min, ".") }
            END {
              split(stable, max, ".")
              if (min[1] != 1 || max[1] != "go1" || min[2] !~ /^[0-9]+$/ ||
                  max[2] !~ /^[0-9]+$/ || min[2] > max[2]) exit 1
              printf "versions=["
              for (v = min[2]; v <= max[2]; v++)
                printf "%s\"1.%d\"", (v == min[2] ? "" : ","), v
              print "]"
            }
          ' go.mod >> "$GITHUB_OUTPUT"

  test:
    needs: go-versions
    name: Build and test (go ${{ matrix.go }} / ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        go: ${{ fromJSON(needs.go-versions.outputs.versions) }}
        os: [ubuntu-latest, windows-latest]
    steps:
      - name: Set git to use LF
        run: |
          git config --global core.autocrlf false
          git config --global core.eol lf
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Set up Go ${{ matrix.go }}
        uses: actions/setup-go@v7.0.0
        with:
          go-version: ${{ matrix.go }}
      - name: Run tests
        run: go test -v ./...
      - name: Run tests under race detector
        run: go test -v ./... -race

  lint:
    name: lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod
      - name: Check that go.mod and go.sum are tidy
        run: go mod tidy -diff
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9.3.0
        with:
          version: v2.15.0

  workflows:
    name: Lint workflows
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7.0.0
        with:
          go-version: stable
      - name: actionlint
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
      - name: Verify action lockfile
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh extension install github/gh-actions-lock --pin v0.4.1
          gh actions-lock --verify
      - name: zizmor
        uses: zizmorcore/zizmor-action@v0.8.1
        with:
          version: 1.32.0
          advanced-security: false

  ci:
    name: CI Success
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [go-versions, test, lint, workflows]
    steps:
      - run: exit 1
        if: >-
          ${{
               contains(needs.*.result, 'failure')
            || contains(needs.*.result, 'cancelled')
          }}
