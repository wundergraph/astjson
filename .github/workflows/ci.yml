name: ci
on:
  pull_request:
    branches:
      - master
  push:
    branches:
      - master

permissions:
  contents: read

# A new push to a pull request cancels the run of the previous one. Every run
# on master gets a group of its own, so none is cancelled, not even while it
# waits behind another.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

# Actions are referenced by full version tag when the release is immutable
# (the tag can never be moved), and by commit SHA otherwise.
jobs:
  go-versions:
    name: Go versions
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      versions: ${{ steps.versions.outputs.versions }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7.0.0
        with:
          go-version: stable
          cache: false
      # Every Go minor release from the one go.mod requires up to the current
      # stable release, e.g. ["1.25","1.26","1.27"].
      - name: List Go versions from go.mod to stable
        id: versions
        env:
          GOTOOLCHAIN: local
        run: |
          oldest=$(sed -n 's/^go 1\.\([0-9]*\).*/\1/p' go.mod)
          stable=$(go env GOVERSION | sed -n 's/^go1\.\([0-9]*\).*/\1/p')
          if [ -z "$oldest" ] || [ -z "$stable" ] || [ "$oldest" -gt "$stable" ]; then
            echo "cannot build a Go version range from go.mod (1.$oldest) to stable (1.$stable)" >&2
            exit 1
          fi
          versions=$(seq "$oldest" "$stable" | jq -Rnc '[inputs | "1.\(.)"]')
          echo "versions=$versions" | tee -a "$GITHUB_OUTPUT"

  test:
    needs: go-versions
    name: Build and test (go ${{ matrix.go }} / ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        go: ${{ fromJSON(needs.go-versions.outputs.versions) }}
        os: [ubuntu-latest, windows-latest]
    steps:
      - name: Set git to use LF
        run: |
          git config --global core.autocrlf false
          git config --global core.eol lf
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Go ${{ matrix.go }}
        uses: actions/setup-go@v7.0.0
        with:
          go-version: ${{ matrix.go }}
      - name: Run tests
        run: go test -v ./...
      - name: Run tests under race detector
        run: go test -v ./... -race

  lint:
    name: lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod
      - name: Check that go.mod and go.sum are tidy
        run: go mod tidy -diff
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9.3.0
        with:
          version: v2.15.0

  workflows:
    name: Lint workflows
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7.0.0
        with:
          go-version: stable
      - name: actionlint
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
      # zizmor cannot tell whether a tag is immutable, so this does: an action
      # is referenced either by commit SHA or by the tag of an immutable release.
      - name: Check that action tags are immutable
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          status=0
          uses=$(grep -rhoE '^[[:space:]]*(-[[:space:]]+)?uses:[[:space:]]*[^[:space:]#]+' .github/workflows \
            | sed -E 's/.*uses:[[:space:]]*//' | tr -d "\"'" | sort -u)
          for use in $uses; do
            case "$use" in ./*|docker://*) continue ;; esac
            ref=${use##*@}
            if [[ "$ref" =~ ^[0-9a-f]{40}$ ]]; then
              continue
            fi
            repo=$(echo "${use%@*}" | cut -d/ -f1-2)
            immutable=$(gh api "repos/$repo/releases/tags/$ref" --jq .immutable 2>/dev/null) || immutable="no such release"
            if [ "$immutable" = "true" ]; then
              echo "$use: immutable release"
            else
              echo "::error::$use is neither a commit SHA nor the tag of an immutable release (immutable: $immutable)"
              status=1
            fi
          done
          exit "$status"
      - name: zizmor
        uses: zizmorcore/zizmor-action@v0.8.1
        with:
          version: 1.32.0
          advanced-security: false

  ci:
    name: CI Success
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [go-versions, test, lint, workflows]
    steps:
      - run: exit 1
        if: >-
          ${{
               contains(needs.*.result, 'failure')
            || contains(needs.*.result, 'cancelled')
          }}
